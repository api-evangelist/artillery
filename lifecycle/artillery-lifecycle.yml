  docs: https://www.artillery.io/changelog
  note: >-
    Artillery versions the CLI (the load-testing product) with semver on the 2.x line and ships
    the Artillery Cloud dashboard continuously — the changelog is filtered by CLI / Dashboard /
    VS Code Extension surfaces. The Artillery Cloud REST API at app.artillery.io/api carries no
    published version scheme, because it carries no published contract at all.
  channels:
  - name: latest
    install: npm install -g artillery@latest
  - name: canary
    install: npm install -g artillery@canary
    note: A canary release is published on every commit to the GitHub repository.
