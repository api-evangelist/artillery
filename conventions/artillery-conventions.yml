method: searched
source: >-
  https://www.artillery.io/docs/reference/stash, https://www.artillery.io/docs/reference/cli/run,
  https://www.artillery.io/pricing, plus live anonymous probes of https://app.artillery.io/api
scope_note: >-
  Artillery's PRIMARY agent-facing surface is a CLI, not a REST API. The Artillery Cloud REST
  API at https://app.artillery.io/api exists but is undocumented and returns 401 to every
  anonymous request, so the runtime semantics below are recorded only where the provider states
  them or where a live probe demonstrated them. Nothing is inferred from a spec — there is none.
authentication:
  style: api-key
  key_prefix: a9_
  transport:
  - artillery run --record --key <key>
  - ARTILLERY_CLOUD_API_KEY environment variable
  api_transport: undocumented bearer/session token on app.artillery.io/api
  see: authentication/artillery-authentication.yml
idempotency:
  supported: false
  coverage: none
  header: null
  scope: []
  retention: null
  note: >-
    No idempotency key, no replay-protection contract, and no documented retry semantics on any
    Artillery surface. The CLI's own operation (recording a test run) creates a new report per
    run by design; re-running a test does not deduplicate. Recorded as `none` rather than `na`
    because Artillery Cloud does have a mutating surface (creating and deleting reports,
    force-stopping runs, Stash writes) — it just carries no replay protection.
pagination:
  style: unknown
  params: []
  response_fields: []
  note: The Cloud API is undocumented and auth-gated; pagination could not be observed anonymously.
