  rfc9457: false
  note: >-
    This envelope was OBSERVED on a live anonymous probe on 2026-09-07, not read from
    documentation. It is the only publicly observable response shape of the Artillery Cloud API.
rate_limit_signaling:
  headers_observed: []
  status_on_exhaustion: null
  note: >-
    No X-RateLimit-*, RateLimit-* or Retry-After headers were returned on the anonymous 401.
    Artillery publishes plan-level quotas, not HTTP rate limits. See rate-limits/.
  see: rate-limits/artillery-rate-limits.yml
request_tracing:
  request_id_header: null
  outbound: >-
    Artillery ADDS W3C Trace Context `traceparent` headers to the requests it generates against
    a system under test (config.http.distributedTracing, CLI 2.0.31+). This is outbound
    generated-traffic behaviour, not a tracing convention of Artillery's own API.
  docs: https://www.artillery.io/docs/observability/opentelemetry
metadata:
  supported: true
  mechanism: >-
    Test runs carry a --name used to group runs in the Artillery Cloud dashboard, and
    --aws-tags (CLI 2.0.34+) applies custom tags to the AWS resources a distributed run creates.
  docs: https://www.artillery.io/docs/reference/cli/run
reversibility:
  grade: documented
  applies_to: artillery-cloud
  note: >-
    Artillery Cloud has real write surfaces (recording a test report, running a distributed test
    that provisions AWS/Azure resources, writing to Stash) and publishes reversal paths for some
    of them, but states a bounded window for NONE of them. No window is asserted here.
  write_surfaces:
  - surface: test run in progress
    reversal: Force early stop
    operation_id: null
    window: null
    window_stated: false
    evidence: >-
      "Force early stop" is listed as a plan feature on https://www.artillery.io/pricing
      (available on Team and Business). The pricing FAQ confirms early-stopped runs still count
      against the test-report quota.
  - surface: recorded test report
    reversal: delete report
    operation_id: null
    window: null
    window_stated: false
    evidence: >-
      The pricing FAQ states the test-volume limit "includes reports from tests that are stopped
      early and reports that are deleted" — deletion exists and is NOT reversible for quota
      purposes.
  - surface: Stash key/value writes
    reversal: delete key / set expiry
    operation_id: null
    window: null
    window_stated: false
    evidence: >-
      https://www.artillery.io/docs/reference/stash documents artillery.stash delete and
      artillery.stash.expire(key, seconds) — the caller sets the TTL, the provider states none.
  - surface: distributed run resources (AWS Fargate)
    reversal: automatic self-termination
    operation_id: null
    window: 180 seconds
    window_stated: true
    evidence: >-
      Changelog CLI 2.0.31 (2026-04-24): Fargate worker tasks self-terminate if the CLI
      disappears for more than 180 seconds. This is the ONE bounded window Artillery publishes,
      and it is a cleanup guarantee rather than a user-invoked undo.
  irreversible:
  - surface: data retention expiry
    note: >-
      Reports and trace recordings outside the plan's retention period (1 / 6 / 18 months) can
      no longer be viewed or queried. Stated on the pricing page; not reversible.
dry_run_mode:
  supported: true
  note: >-
    The Artillery CLI supports validating a test script without executing load, and the
    third-party-facing `artillery quick` / `artillery ping` commands send a single request rather
    than a load profile. This is CLI behaviour, not an API dry-run parameter.
  docs: https://www.artillery.io/docs/reference/cli
