specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Artillery
providerId: artillery
created: '2026-05-04'
modified: '2026-09-07'
generated: '2026-09-07'
method: searched
source: https://www.artillery.io/pricing
note: >-
  REPLACES a 2026-05-04 bulk-sweep scaffold that invented free/pro/enterprise tiers with
  1,000 and 100,000 request quotas Artillery never published. Every value below is read from
  https://www.artillery.io/pricing (HTTP 200, fetched 2026-09-07). Artillery meters TEST REPORTS
  sent to Artillery Cloud, not API requests — the scaffold's request-quota model did not exist.
  A subscription covers both the Artillery CLI and the Artillery Cloud dashboard, and includes
  both load testing and E2E testing.
tags:
- Load Testing
- Performance Testing
- Open Source
- Testing
- DevOps
- Node.js
description: >-
  Published Artillery Cloud subscription tiers. Metering unit is the test report: each distinct
  load test or E2E test recorded to Artillery Cloud counts as one report, including runs stopped
  early and reports subsequently deleted.
billing:
  currency: USD
  period: month
  annual_discount: '20% when subscribed annually'
  payment_methods:
  - card
  - ACH
  - AWS Marketplace
  - invoice (via sales@artillery.io)
  self_service: true
  self_service_note: >-
    Subscriptions can be created from Settings > Billing in the Artillery Cloud dashboard, or via
    the payment links on the pricing page; payment-link subscribers must email support@artillery.io
    with their organization link for the subscription to be activated.
plan_count: 4
plans:
- id: artillery-free
  name: Free
  type: freemium
  price: '0.00'
  currency: USD
  period: month
  description: Hobby and proof-of-concept projects. Sign up with a GitHub account at https://app.artillery.io.
  entries:
  - {label: Test volume, name: test_reports, type: quota, metric: reports, limit: 30, timeFrame: month}
  - {label: Data retention, name: retention, type: limit, metric: months, limit: 1}
  - {label: Team members, name: team_members, type: limit, metric: users, limit: 2}
  - {label: Distributed test workers, name: workers, type: limit, metric: workers_per_test, limit: 5}
  - {label: Test duration, name: test_duration, type: limit, metric: minutes, limit: 30}
  - {label: E2E test cases per report, name: e2e_cases, type: limit, metric: cases, limit: 25}
  elements:
  - name: Artillery CLI
  - name: Artillery Cloud dashboard
  - name: Load testing
  - name: E2E testing
  - name: Distributed tests (AWS & Azure)
  - name: Share reports
- id: artillery-team
  name: Team
  type: paid
  price: '199.00'
  currency: USD
  period: month
  description: Small teams running regular testing at smaller scale.
  entries:
  - {label: Test volume, name: test_reports, type: quota, metric: reports, limit: 1000, timeFrame: month}
  - {label: Data retention, name: retention, type: limit, metric: months, limit: 6}
  - {label: Team members, name: team_members, type: limit, metric: users, limit: 8}
  - {label: Distributed test workers, name: workers, type: limit, metric: workers_per_test, limit: 25}
  - {label: Test duration, name: test_duration, type: limit, metric: hours, limit: 2}
  - {label: E2E test cases per report, name: e2e_cases, type: limit, metric: cases, limit: 50}
  elements:
  - name: Everything in Free
  - name: Custom charts
  - name: Performance trends
  - name: Force early stop
  - name: Stash API
  - name: Email support
- id: artillery-business
  name: Business
  type: paid
  price: '499.00'
  currency: USD
  period: month
  description: Testing at larger scale with advanced features.
  entries:
  - {label: Test volume, name: test_reports, type: quota, metric: reports, limit: 2500, timeFrame: month}
  - {label: Data retention, name: retention, type: limit, metric: months, limit: 18}
  - {label: Team members, name: team_members, type: limit, metric: users, limit: -1, note: no limit}
  - {label: Distributed test workers, name: workers, type: limit, metric: workers_per_test, limit: -1, note: no limit}
  - {label: Test duration, name: test_duration, type: limit, metric: minutes, limit: -1, note: no limit}
  - {label: E2E test cases per report, name: e2e_cases, type: limit, metric: cases, limit: -1, note: no limit}
  elements:
  - name: Everything in Team
  - name: Spend & volume controls
  - name: Workspaces
  - name: Slack Connect (available with annual subscription)
- id: artillery-enterprise
  name: Enterprise add-ons
  type: enterprise
  price: '1199.00'
  price_qualifier: starting at
  currency: USD
  period: month
  description: >-
    Add-on layer on top of a paid subscription. Published starting price; final pricing is
    negotiated.
  entries: []
  elements:
  - name: Enterprise SSO (OIDC & SAML)
  - name: Audit logs
  - name: Custom MSA
  - name: Support SLAs
  - name: 'Deploy to your own AWS account (BYOC) — managed deployment into a customer-owned AWS account'
overage:
  model: none-published
  behaviour: >-
    Published policy rather than a price: "Artillery Cloud will continue working as normal if
    limits are exceeded sporadically. If limits are exceeded continuously service may be degraded
    to prioritize other users, and your account may be placed in read-only mode."
  source: https://www.artillery.io/pricing (FAQ, "What happens if we exceed a limit?")
trial:
  free_tier: true
  paid_trial: on request via sales@artillery.io
contacts:
  sales: sales@artillery.io
  support: support@artillery.io
