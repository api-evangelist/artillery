policies:
- name: What counts as a test report
  description: >-
    Each distinct load test or E2E test recorded to Artillery Cloud counts as one test report.
    The limit includes reports from tests stopped early and reports that are later deleted.
  source: https://www.artillery.io/pricing
- name: Exceeding a limit
  description: >-
    Artillery Cloud continues working as normal if limits are exceeded sporadically. If limits
    are exceeded continuously, service may be degraded to prioritize other users and the account
    may be placed in read-only mode.
  source: https://www.artillery.io/pricing
- name: Spend and volume controls
  description: Spend & volume controls are a Business-tier feature.
  source: https://www.artillery.io/pricing
- name: Data retention
  description: >-
    Reports and assets such as trace recordings are queryable for 1 month (Free), 6 months
    (Team) or 18 months (Business); outside that window they can no longer be viewed or queried.
  source: https://www.artillery.io/pricing
