specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Artillery
providerId: artillery
created: '2026-05-04'
modified: '2026-09-07'
generated: '2026-09-07'
method: searched
source: https://www.artillery.io/pricing
note: >-
  REPLACES a 2026-05-04 bulk-sweep scaffold that asserted 10/100/1000 requests-per-minute tiers,
  X-RateLimit-* response headers and 429 semantics that Artillery has never published. NONE of
  that was real. Artillery publishes NO HTTP rate limits, NO rate-limit response headers and NO
  documented 429 behaviour for the Artillery Cloud API — that API is undocumented and returns 401
  to every anonymous request. What Artillery DOES publish are plan-level usage quotas metered in
  test reports, plus per-plan ceilings on distributed workers and test duration. Those are
  recorded below as the real published limits.
tags:
- Load Testing
- Performance Testing
- Quotas
- Rate Limiting
description: >-
  Published Artillery Cloud usage limits. The metering unit is the test report, not the API
  request. Concurrency ceilings are expressed as distributed workers per test and maximum test
  duration.
headers:
  limit: null
  remaining: null
  reset: null
  retryAfter: null
  policy: null
  observed: []
  note: >-
    No X-RateLimit-*, RateLimit-* or Retry-After headers were returned on a live anonymous
    request to https://app.artillery.io/api (HTTP 401, application/json, 2026-09-07).
responseCodes:
  throttled: null
  quotaExceeded: null
  serviceUnavailable: null
  note: >-
    Artillery publishes no status code for quota exhaustion. Its stated behaviour is degradation
    and read-only mode, not a throttling response.
