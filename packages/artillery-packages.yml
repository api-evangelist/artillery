method: searched
source: >-
  registry.npmjs.org metadata endpoints, github.com/artilleryio (org repo listing),
  https://www.artillery.io/docs/get-started/get-artillery
note: >-
  Artillery ships no conventional REST client SDK, because the Artillery Cloud REST API at
  https://app.artillery.io/api is not publicly documented (every path returns
  {"error":{"data":{"message":"Missing auth token","code":401}}} anonymously). The first-party
  client for Artillery Cloud is the `artillery` CLI itself (it records runs to Cloud with
  --record/--key) and the @artilleryio/playwright-reporter library, which posts Playwright E2E
  results to Artillery Cloud from inside a Playwright test run. Everything else below is a
  first-party engine or plugin published from the artilleryio monorepo. Versions and dates are
  read from registry.npmjs.org on the generated date.
