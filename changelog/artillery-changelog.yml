- version: 2.0.34
  date: '2026-08-14'
  surface: CLI
  breaking: false
  additions:
  - '`artillery ping` command for quick HTTP endpoint testing with a DNS/TCP/TLS/TTFB/download breakdown, --expect expectations, JMESPath and Cheerio body queries, HTTP/2 by default'
  - Full ESM support in processors, plugins, engines and custom reporters, including top-level await
  - TypeScript type definitions modelling the full test script now ship with the `artillery` package
  - '`--aws-tags` flag to tag AWS resources created for a distributed run'
  - Playwright upgraded to v1.62.1
  fixes:
  - relative imports in processor code no longer fail to run
  - '$rewriteMetricName no longer silently ignored for ES module processors'
  - fake-data plugin bundled into the worker image instead of downloaded at test startup
  highlights: npm releases now published via npm trusted publishing (OIDC) with provenance attestations
  release: https://github.com/artilleryio/artillery/releases/tag/artillery-2.0.34
- version: null
  date: '2026-07-29'
