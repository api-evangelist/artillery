- version: 2.0.32
  date: '2026-05-19'
  surface: CLI
  breaking: false
  additions:
  - Playwright upgraded to v1.60.0
  fixes:
  - http.timeout no longer silently capped at 8 seconds for slow origins
  - MODULE_NOT_FOUND startup failures for @smithy/node-config-provider and @smithy/config-resolver
  - Fargate runs no longer silently start with fewer VUs after undetected worker startup errors
  - trace upload errors now surfaced in CLI output
  release: https://github.com/artilleryio/artillery/releases/tag/artillery-2.0.32
- version: 2.0.31
  date: '2026-04-24'
  surface: CLI
  breaking: true
  breaking_note: >-
    HTTP engine upgraded from Got v11 to Got v14.6.6 — potentially breaking for tests whose
    hooks access or modify Got internals.
  additions:
  - W3C Trace Context propagation on outgoing HTTP requests via config.http.distributedTracing (traceparent header)
  - Fargate CLI heartbeat — worker tasks self-terminate if the CLI disappears for more than 180 seconds
  - notifyOnFailureOnly option for the Slack plugin
  - Playwright upgraded to v1.59.1
  fixes:
  - AWS Lambda no longer silently skips npm dependency installation for tests with external modules
  - Azure ACI test artifacts in Blob Storage now retained by default
  release: https://github.com/artilleryio/artillery/releases/tag/artillery-2.0.31
