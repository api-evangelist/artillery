apis:
- aid: artillery:artillery-cloud-api
  name: Artillery Cloud API
  description: >-
    Artillery Cloud is the hosted platform behind the open source Artillery CLI: it runs
    distributed load and Playwright E2E tests at scale across AWS Lambda, AWS Fargate and
    Azure ACI, stores and retains test reports, provides performance trends, custom charts,
    workspaces and the Redis-compatible Stash key/value store, and integrates with CI/CD.
    The HTTP surface at https://app.artillery.io/api is real but UNDOCUMENTED — every
    anonymous request returns HTTP 401 with the body
    {"error":{"data":{"message":"Missing auth token","code":401,"type":"ServerError"}}},
    and Artillery publishes no OpenAPI, GraphQL schema or written reference for it (probed
    2026-09-07). The documented, first-party way to drive Artillery Cloud programmatically is
    the artillery CLI with --record and --key, the ARTILLERY_CLOUD_API_KEY environment
    variable, and the @artilleryio/playwright-reporter library.
  humanURL: https://www.artillery.io/docs/reference/cli/run
  baseURL: https://app.artillery.io/api
